<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181C">
<title>Paz Services — Taller</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --fondo:#E9EBED; --panel:#FFFFFF; --tinta:#14181C; --humo:#67717C;
  --linea:#D2D7DC; --accion:#14181C; --alerta:#B3341F; --ok:#1C7A4A;
  --aviso:#B4761A; --marca:#F2A900;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--fondo); color:var(--tinta);
  font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}

header{
  background:var(--accion); color:#fff; padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  position:sticky; top:0; z-index:20;
}
header .marca{font-weight:600;letter-spacing:.02em;font-size:15px}
header .marca span{display:block;font-weight:400;font-size:12px;color:#9AA4AE}
header button{
  background:none;border:1px solid #3A424B;color:#C9D0D6;
  padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer
}

main{padding:16px;max-width:640px;margin:0 auto}
main.con-navinf{padding-bottom:84px}

.oculto{display:none !important}

/* Navegación inferior (Terreno / Laboratorio / Agenda / Gastos) */
.navinf{
  position:fixed;bottom:0;left:0;right:0;z-index:20;max-width:640px;margin:0 auto;
  display:flex;background:var(--panel);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom)
}
.navinf button,.navinf a{
  flex:1;background:none;border:none;padding:12px 4px 10px;cursor:pointer;
  color:var(--humo);font-size:13px;font-weight:500;text-decoration:none;text-align:center
}
.navinf button[aria-current="true"]{color:var(--tinta);box-shadow:inset 0 2px 0 var(--marca)}

.seccion-tit{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.seccion-tit h2{margin:0}
.seccion-tit span{font-size:13px;color:var(--humo)}

/* Login */
.login{max-width:360px;margin:12vh auto;padding:0 20px}
.login h1{font-size:22px;font-weight:600;margin:0 0 4px}
.login p{color:var(--humo);margin:0 0 28px;font-size:15px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13px;color:var(--humo);margin-bottom:5px}
.campo input,.campo textarea,.campo select{
  width:100%;padding:13px 14px;border:1px solid var(--linea);
  border-radius:8px;background:var(--panel)
}
.campo textarea{min-height:88px;resize:vertical}

.btn{
  width:100%;padding:16px;border:none;border-radius:8px;
  background:var(--accion);color:#fff;font-weight:500;font-size:16px;cursor:pointer
}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.5}
.btn.claro{background:var(--panel);color:var(--tinta);border:1px solid var(--linea)}

.aviso{
  padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;
  background:#FBE9E6;color:var(--alerta);border:1px solid #F0C4BC
}
.aviso.bien{background:#E4F1EA;color:var(--ok);border-color:#BFDECC}

/* Barra superior del tablero */
.barra{display:flex;gap:10px;margin-bottom:16px}
.barra .btn{padding:14px}

/* Tarjetas OT */
.lista{display:flex;flex-direction:column;gap:10px}
.ot{
  background:var(--panel);border:1px solid var(--linea);border-radius:10px;
  padding:14px;cursor:pointer;text-align:left;width:100%;display:block
}
.ot:active{border-color:var(--humo)}
.ot .fila1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ot .num{font-family:var(--mono);font-size:13px;color:var(--humo);letter-spacing:.02em}
.ot .dias{font-size:12px;color:var(--humo)}
.ot .dias.tarde{color:var(--alerta);font-weight:500}
.ot .cliente{font-weight:500;font-size:17px;margin:5px 0 2px}
.ot .detalle{font-size:14px;color:var(--humo)}
.ot .detalle .pat{font-family:var(--mono);text-transform:uppercase}
.ot .sintoma{font-size:14px;color:var(--humo);margin-top:6px}

.chip{
  display:inline-block;margin-top:9px;padding:4px 10px;border-radius:999px;
  font-size:12.5px;font-weight:500;background:#E3E7EA;color:#3A434C
}
.chip.terreno{background:#EDE6F7;color:#4A3A73}
.chip.trabajo{background:#FDF0D9;color:#7A5209}
.chip.espera{background:#FBE9E6;color:#8C2A18}
.chip.listo{background:#E4F1EA;color:#14603A}

.vacio{text-align:center;padding:48px 20px;color:var(--humo)}
.vacio p{margin:0 0 18px}

h2{font-size:19px;font-weight:600;margin:0 0 16px}
.seccion{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:16px;margin-bottom:14px}

/* Selector origen y tipo */
.opciones{display:flex;gap:8px;flex-wrap:wrap}
.opciones button{
  flex:1;min-width:calc(33% - 6px);padding:13px 8px;border:1px solid var(--linea);
  border-radius:8px;background:var(--panel);cursor:pointer;font-size:15px
}
.opciones button[aria-pressed="true"]{background:var(--accion);color:#fff;border-color:var(--accion)}

/* Detalle */
.dato{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:15px}
.dato:last-child{border-bottom:none}
.dato span:first-child{color:var(--humo)}
.dato span:last-child{text-align:right;font-weight:500}
.estados{display:flex;flex-direction:column;gap:8px}
.estados button{
  padding:15px;border:1px solid var(--linea);border-radius:8px;
  background:var(--panel);cursor:pointer;text-align:left;font-size:16px
}
.estados button.actual{background:var(--accion);color:#fff;border-color:var(--accion)}
.rotulo{display:block;font-size:13px;color:var(--humo);margin-bottom:10px}
.fila-cot-ant{display:flex;gap:8px;margin-bottom:8px}
.fila-cot-ant .cot-cargar{flex:1;padding:15px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left;font-size:16px}
.fila-cot-ant .cot-cargar.actual{background:var(--accion);color:#fff;border-color:var(--accion)}
.fila-cot-ant .cot-borrar{flex:0 0 auto;width:50px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);color:var(--alerta);font-size:19px;cursor:pointer}
.rotulo.sep{margin-top:20px}
.pista{font-size:13px;margin-top:6px;color:var(--humo)}
.pista.mal{color:var(--alerta)}
.pista.bien{color:var(--ok)}

.item-cot{background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:12px;margin-bottom:10px}
.item-cot .campo{margin-bottom:10px}
.item-cot .campo:last-child{margin-bottom:0}
.item-cot .fila-cv{display:flex;gap:8px;align-items:center}
.item-cot .fila-cv .campo{flex:1;margin-bottom:0}
.item-cot .quitar-item{flex:0 0 auto;background:none;border:none;color:var(--alerta);font-size:26px;line-height:1;cursor:pointer;padding:8px}

.foto-btn{
  display:block;padding:15px;border:1px dashed var(--humo);border-radius:8px;
  text-align:center;color:var(--humo);cursor:pointer;font-size:15px
}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.miniaturas img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--linea)}

.cargando{text-align:center;padding:40px;color:var(--humo)}

/* ---------- Agenda ---------- */
.semana-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.semana-nav button{flex:0 0 auto;width:auto;padding:11px 18px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);cursor:pointer;font-size:17px}
.semana-nav .lbl{font-size:14.5px;font-weight:500;text-align:center}
.dia-grupo{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.dia-grupo:first-child{margin-top:0}
.dia-grupo .nombre{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--humo)}
.reordenar{display:flex;gap:8px;margin-top:10px}
.reordenar button{flex:1;padding:14px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);font-size:18px;cursor:pointer}
.reordenar button[disabled]{opacity:.35}
.enlaces{display:flex;gap:8px;margin-top:6px}
.enlaces a{
  flex:1;display:block;text-align:center;padding:13px;border:1px solid var(--linea);
  border-radius:8px;background:var(--panel);color:var(--tinta);text-decoration:none;font-size:14.5px
}

/* ---------- Informe técnico ---------- */
.hoja{background:#fff;padding:26px 22px;border:1px solid var(--linea);border-radius:10px;color:#000}
.hoja .cab{border-bottom:3px solid var(--tinta);padding-bottom:10px;margin-bottom:18px}
.hoja .cab h1{font-size:17px;font-weight:700;letter-spacing:.08em;margin:0}
.hoja .cab .sub{font-size:12px;color:var(--humo);margin-top:3px}
.hoja table.datos{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13.5px}
.hoja table.datos td{border:1px solid var(--linea);padding:7px 9px;vertical-align:top}
.hoja table.datos td.et{background:#F4F6F7;font-weight:600;width:34%}
.hoja .resultado{
  border:2px solid var(--tinta);border-radius:6px;padding:13px;margin-bottom:20px;
  font-size:14.5px;font-weight:600;text-align:center
}
.hoja h3{font-size:13.5px;font-weight:700;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.hoja p{font-size:13.5px;margin:0;white-space:pre-wrap;line-height:1.5}
.hoja table.valor{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.hoja table.valor td{padding:6px 9px;border-bottom:1px solid var(--linea)}
.hoja table.valor td:last-child{text-align:right;font-family:var(--mono)}
.hoja table.valor tr.total td{font-weight:700;border-bottom:none;border-top:2px solid var(--tinta)}
.hoja .firmas{display:flex;gap:26px;margin-top:52px;font-size:12.5px;text-align:center}
.hoja .firmas div{flex:1;border-top:1px solid var(--tinta);padding-top:7px}

@media print{
  body{background:#fff}
  header,.noimprimir{display:none !important}
  main{padding:0;max-width:none}
  .hoja{border:none;border-radius:0;padding:0}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="vLogin" class="login">
  <h1>Paz Services</h1>
  <p>Control de taller</p>
  <div id="loginError" class="aviso oculto"></div>
  <div class="campo">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
  </div>
  <div class="campo">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password">
  </div>
  <button class="btn" id="btnEntrar">Entrar</button>
</section>

<!-- ============ APP ============ -->
<div id="app" class="oculto">
  <header>
    <div class="marca">PAZ SERVICES<span id="quien"></span></div>
    <button id="btnSalir">Salir</button>
  </header>
  <main id="main">

    <!-- Tablero (Terreno / Laboratorio / Agenda) -->
    <section id="vTablero">
      <div class="seccion-tit">
        <h2 id="seccionTitulo">Terreno</h2>
        <span id="seccionSub"></span>
      </div>

      <div id="agendaControles" class="oculto">
        <div class="semana-nav">
          <button type="button" id="btnSemanaAnt">◀</button>
          <span class="lbl" id="semanaLabel"></span>
          <button type="button" id="btnSemanaSig">▶</button>
        </div>
        <div class="opciones" id="selAgendaOrigen" style="margin-bottom:14px">
          <button type="button" data-v="terreno" aria-pressed="true">Terreno</button>
          <button type="button" data-v="laboratorio" aria-pressed="false">Laboratorio</button>
        </div>
      </div>

      <div class="barra">
        <button class="btn" id="btnNueva">Nueva OT</button>
        <button class="btn oculto" id="btnAgendar">Agendar</button>
        <button class="btn claro" id="btnRecargar" style="max-width:110px">Recargar</button>
      </div>
      <div id="listaOT" class="lista"></div>
    </section>

    <!-- Nueva OT -->
    <section id="vNueva" class="oculto">
      <h2>Nueva orden</h2>
      <div id="nuevaError" class="aviso oculto"></div>

      <div class="seccion">
        <div class="campo">
          <label>¿Qué tipo de trabajo es?</label>
          <div class="opciones" id="selTipoTrabajo">
            <button type="button" data-v="modulo" aria-pressed="true">Módulo</button>
            <button type="button" data-v="servicio" aria-pressed="false">Reparación en terreno</button>
          </div>
        </div>
        <div class="campo" id="campoOrigen">
          <label>¿De dónde viene?</label>
          <div class="opciones" id="selOrigen">
            <button type="button" data-v="laboratorio" aria-pressed="true">Llegó al laboratorio</button>
            <button type="button" data-v="terreno" aria-pressed="false">Retiro en terreno</button>
          </div>
        </div>
        <div class="campo">
          <label for="fCliente">Cliente</label>
          <input id="fCliente" list="dlClientes" autocomplete="organization" placeholder="Nombre o empresa">
          <datalist id="dlClientes"></datalist>
        </div>
        <div class="campo">
          <label for="fRut">RUT para facturar</label>
          <input id="fRut" autocomplete="on" inputmode="text" placeholder="76.543.210-9">
          <div class="pista" id="pistaRut"></div>
        </div>
        <div class="campo">
          <label for="fPatente">Patente</label>
          <input id="fPatente" autocomplete="on" style="text-transform:uppercase;font-family:var(--mono)" placeholder="ABCD12">
        </div>
        <div class="campo" id="campoModulo">
          <label for="fModulo">Tipo de módulo</label>
          <input id="fModulo" list="dlModulos" autocomplete="on" placeholder="Escribe el módulo">
          <datalist id="dlModulos"></datalist>
        </div>
        <div class="campo oculto" id="campoSistema">
          <label for="fSistema">Sistema afectado</label>
          <input id="fSistema" list="dlSistemas" autocomplete="on" placeholder="Eléctrico, neumático, hidráulico…">
          <datalist id="dlSistemas"></datalist>
        </div>
        <div class="campo">
          <label for="fSintoma">¿Qué falla tiene?</label>
          <textarea id="fSintoma" autocomplete="on" placeholder="Lo que dijo el cliente"></textarea>
        </div>
        <label class="foto-btn" for="fFoto" id="lblFoto">Tomar foto de recepción</label>
        <input id="fFoto" type="file" accept="image/*" capture="environment">
        <div class="miniaturas" id="previaFoto"></div>
      </div>

      <div class="seccion">
        <button type="button" class="btn claro" id="btnToggleAgendar">+ Agendar esta orden</button>
        <div id="camposAgenda" class="oculto" style="margin-top:14px">
          <div class="campo">
            <label for="fFechaAgendada">Fecha agendada</label>
            <input id="fFechaAgendada" type="date">
          </div>
          <div class="campo">
            <label>Franja</label>
            <div class="opciones" id="selFranja">
              <button type="button" data-v="manana" aria-pressed="true">Mañana</button>
              <button type="button" data-v="tarde" aria-pressed="false">Tarde</button>
              <button type="button" data-v="todo_el_dia" aria-pressed="false">Todo el día</button>
            </div>
          </div>
          <div class="campo">
            <label for="fUbicacionGps">Ubicación GPS</label>
            <input id="fUbicacionGps" placeholder="Link de Maps, coordenadas o texto de referencia">
          </div>
          <div class="campo">
            <label for="fTecnicoAgendado">Técnico agendado</label>
            <select id="fTecnicoAgendado">
              <option value="">Sin asignar</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn" id="btnGuardar">Guardar orden</button>
      <div style="height:10px"></div>
      <button class="btn claro" id="btnCancelar">Cancelar</button>
    </section>

    <!-- Detalle -->
    <section id="vDetalle" class="oculto">
      <h2 id="detTitulo"></h2>
      <div id="detError" class="aviso oculto"></div>
      <div class="seccion" id="detDatos"></div>
      <div class="seccion">
        <div class="estados" id="detEstados"></div>
      </div>
      <div class="seccion" id="detAgenda">
        <span class="rotulo">Agenda</span>
        <div id="detAgendaInfo"></div>
        <div id="detAgendaEdit" class="oculto" style="margin-top:14px">
          <div class="campo">
            <label for="dFechaAgendada">Fecha agendada</label>
            <input id="dFechaAgendada" type="date">
          </div>
          <div class="campo">
            <label>Franja</label>
            <div class="opciones" id="selFranjaDet">
              <button type="button" data-v="manana" aria-pressed="true">Mañana</button>
              <button type="button" data-v="tarde" aria-pressed="false">Tarde</button>
              <button type="button" data-v="todo_el_dia" aria-pressed="false">Todo el día</button>
            </div>
          </div>
          <div class="campo">
            <label for="dUbicacionGps">Ubicación GPS</label>
            <input id="dUbicacionGps" placeholder="Link de Maps, coordenadas o texto de referencia">
          </div>
          <div class="campo">
            <label for="dTecnicoAgendado">Técnico agendado</label>
            <select id="dTecnicoAgendado">
              <option value="">Sin asignar</option>
            </select>
          </div>
          <button class="btn" id="btnGuardarAgendaDet">Guardar agenda</button>
        </div>
        <button type="button" class="btn claro oculto" id="btnEditarAgendaDet" style="margin-top:10px">Editar agenda</button>
      </div>
      <div class="seccion">
        <label class="foto-btn" for="dFoto">Subir foto o captura del escáner</label>
        <input id="dFoto" type="file" accept="image/*" capture="environment">
        <div class="miniaturas" id="detFotos"></div>
      </div>
      <button class="btn claro" id="btnCotizar">Cotización</button>
      <div style="height:10px"></div>
      <button class="btn" id="btnCierre">Informe técnico</button>
      <div style="height:10px"></div>
      <button class="btn claro" id="btnVolver">Volver al tablero</button>
    </section>

    <!-- Cotización -->
    <section id="vCotizacion" class="oculto">
      <h2 id="cotTitulo"></h2>
      <div id="cotError" class="aviso oculto"></div>
      <div class="seccion oculto" id="cotAnteriores"></div>
      <div class="seccion">
        <div id="cotItems"></div>
        <button type="button" class="btn claro" id="btnAgregarItem">+ Agregar ítem</button>
      </div>
      <div class="seccion">
        <div class="campo">
          <label for="cotValidez">Cotización válida por (días)</label>
          <input id="cotValidez" inputmode="numeric" value="15">
        </div>
        <div class="dato"><span>Neto</span><span id="cotNeto">$0</span></div>
        <div class="dato"><span>IVA 19%</span><span id="cotIva">$0</span></div>
        <div class="dato"><span>Total</span><span id="cotTotal">$0</span></div>
      </div>
      <button class="btn" id="btnGuardarCot">Guardar cotización</button>
      <div style="height:10px"></div>
      <button class="btn claro" id="btnVerCotFormal">Ver cotización formal</button>
      <div style="height:10px"></div>
      <button class="btn claro" id="btnNuevaCot">+ Nueva cotización para esta orden</button>
      <div style="height:10px"></div>
      <button class="btn claro" id="btnCotVolver">Volver</button>
    </section>

    <!-- Cotización formal (imprimible) -->
    <section id="vCotImp" class="oculto">
      <div id="hojaCotizacion"></div>
      <div class="noimprimir">
        <button class="btn" id="btnImprimirCot">Imprimir o guardar PDF</button>
        <div style="height:10px"></div>
        <button class="btn claro" id="btnCotImpVolver">Volver</button>
      </div>
    </section>

    <!-- Cierre de OT -->
    <section id="vCierre" class="oculto">
      <h2 id="cieTitulo"></h2>
      <div id="cieError" class="aviso oculto"></div>
      <div class="seccion">
        <div class="campo">
          <label for="cModelo">Vehículo (marca y modelo)</label>
          <input id="cModelo" autocomplete="on" placeholder="Mercedes Benz Actros 2045">
        </div>
        <div class="campo">
          <label for="cPruebas">Trabajos realizados</label>
          <textarea id="cPruebas" placeholder="Qué se revisó y qué se hizo"></textarea>
        </div>
        <div class="campo">
          <label for="cCausa">Causa de la falla</label>
          <textarea id="cCausa" placeholder="Qué estaba fallando en realidad"></textarea>
        </div>
        <div class="campo">
          <label for="cSolucion">Resultado final</label>
          <textarea id="cSolucion" placeholder="Cómo quedó el módulo"></textarea>
        </div>
        <div class="campo" id="campoMonto">
          <label for="cMonto">Valor neto del servicio</label>

// ---------- Agenda semanal — capa sobre ordenes, no una entidad aparte ----------
const MES_CORTO = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function isoFecha(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function lunesDeSemana(offset) {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diffLunes = dia === 0 ? -6 : 1 - dia;
  const lunes = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + diffLunes + offset * 7);
  return lunes;
}

async function cargarAgendaSemana() {
  $("listaOT").innerHTML = '<div class="cargando">Cargando agenda…</div>';
  const lunes = lunesDeSemana(semanaOffset);
  const sabado = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + 5);
  $("semanaLabel").textContent =
    `${lunes.getDate()} ${MES_CORTO[lunes.getMonth()]} – ${sabado.getDate()} ${MES_CORTO[sabado.getMonth()]}`;

  const { data:{ user } } = await db.auth.getUser();
  let query = db.from("ordenes")
    .select("id,numero_ot,origen,estado,tipo_trabajo,tipo_modulo,sistema,fecha_agendada,franja,tecnico_agendado,orden_ruta,fecha_ingreso,vehiculo_id,clientes(nombre,rut),vehiculos(patente)")
    .eq("origen", agendaOrigenActiva)
    .gte("fecha_agendada", isoFecha(lunes)).lte("fecha_agendada", isoFecha(sabado))
    .order("fecha_agendada").order("orden_ruta", { nullsFirst: false });
  if (perfil?.rol === "tecnico") query = query.eq("tecnico_agendado", user.id);
  const { data, error } = await query;

  if (error) {
    $("listaOT").innerHTML = '<div class="aviso">No se pudo cargar la agenda. Revisa tu conexión.</div>';
    return;
  }
  if (!data.length) {
    $("listaOT").innerHTML = '<div class="vacio"><p>No hay OT agendadas esta semana.</p></div>';
    return;
  }

  const puedeReordenar = ["dueno","coordinador"].includes(perfil?.rol);
  $("listaOT").innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const dia = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + i);
    const isoDia = isoFecha(dia);
    const delDia = data.filter(o => o.fecha_agendada === isoDia);

    const cab = document.createElement("div");
    cab.className = "dia-grupo";
    cab.innerHTML = `<span class="nombre">${DIAS_SEMANA[i]} ${dia.getDate()}</span>`;
    $("listaOT").appendChild(cab);

    if (!delDia.length) {
      const vacio = document.createElement("div");
      vacio.className = "vacio";
      vacio.style.padding = "14px";
      vacio.innerHTML = "<p>Sin OT agendadas</p>";
      $("listaOT").appendChild(vacio);
      continue;
    }
    delDia.forEach((o, idx) => {
      const card = tarjetaOT(o, { agenda: true });
      if (puedeReordenar) {
        const reord = document.createElement("div");
        reord.className = "reordenar";
        const subir = document.createElement("button");
        subir.type = "button"; subir.textContent = "↑ Subir"; subir.disabled = idx === 0;
        subir.onclick = e => { e.stopPropagation(); moverOrdenRuta(delDia, idx, -1); };
        const bajar = document.createElement("button");
        bajar.type = "button"; bajar.textContent = "↓ Bajar"; bajar.disabled = idx === delDia.length - 1;
        bajar.onclick = e => { e.stopPropagation(); moverOrdenRuta(delDia, idx, 1); };
        reord.appendChild(subir); reord.appendChild(bajar);
        card.appendChild(reord);
      }
      $("listaOT").appendChild(card);
    });
  }
}

async function moverOrdenRuta(lista, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  const actualizaciones = lista.map((o, idx) => db.from("ordenes").update({ orden_ruta: idx + 1 }).eq("id", o.id));
  await Promise.all(actualizaciones);
  cargarAgendaSemana();
}

// ---------- RUT: puntos, guion y dígito verificador ----------
function formatearRut(valor) {
  const limpio = valor.replace(/[^0-9kK]/g, "").toUpperCase();
  if (limpio.length <= 1) return limpio;
  const cuerpo = limpio.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return cuerpo + "-" + limpio.slice(-1);
}

function dvCorrecto(valor) {
  const limpio = valor.replace(/[^0-9kK]/g, "").toUpperCase();
  if (limpio.length < 2) return null;
  const cuerpo = limpio.slice(0, -1), dv = limpio.slice(-1);
  if (!/^\d+$/.test(cuerpo)) return false;
  let suma = 0, factor = 2;
  for (let i = cuerpo.length - 1; i >= 0; i--) {
    suma += parseInt(cuerpo[i], 10) * factor;
    factor = factor === 7 ? 2 : factor + 1;
  }
  const resto = 11 - (suma % 11);
  const esperado = resto === 11 ? "0" : resto === 10 ? "K" : String(resto);
  return dv === esperado;
}

$("fRut").oninput = e => {
  const pos = e.target.selectionStart === e.target.value.length;
  e.target.value = formatearRut(e.target.value);
  if (pos) e.target.setSelectionRange(e.target.value.length, e.target.value.length);
  const ok = dvCorrecto(e.target.value);
  const p = $("pistaRut");
  if (ok === null) { p.textContent = ""; p.className = "pista"; }
  else if (ok)     { p.textContent = "RUT válido"; p.className = "pista bien"; }
  else             { p.textContent = "El dígito verificador no calza. Revísalo."; p.className = "pista mal"; }
};

async function clienteConRut(nombre, rut) {
  const { data } = await db.from("clientes").select("id,rut").ilike("nombre", nombre).limit(1);
  if (data && data.length) {
    const c = data[0];
    if (rut && !c.rut) await db.from("clientes").update({ rut }).eq("id", c.id);
    return c.id;
  }
  const { data: nuevo, error } = await db.from("clientes")
    .insert({ nombre, rut: rut || null }).select("id").single();
  if (error) throw error;
  return nuevo.id;
}

  const { data } = await db.from("vehiculos").select("id").ilike("patente", patente).limit(1);
  if (data && data.length) return data[0].id;
  const { data: nuevo, error } = await db.from("vehiculos").insert({ patente, cliente_id }).select("id").single();
  if (error) throw error;
  return nuevo.id;
}

async function abrirCotizacion(o) {

async function cargarCotizacion(id) {
  cotizacionId = id;
  cotItemsData = [];
  const cot = cotLista.find(c => c.id === id);
  $("cotValidez").value = cot?.validez_dias ?? 15;

  if (id) {
    const { data: items } = await db.from("cotizacion_items")
      .select("descripcion,cantidad,valor_unitario")
      .eq("cotizacion_id", id).order("orden_item");
    cotItemsData = (items || []).map(i => ({ ...i }));
  }
  if (!cotItemsData.length) cotItemsData.push({ descripcion: "", cantidad: 1, valor_unitario: 0 });

  pintarListaCotizaciones();
  pintarItemsCotizacion();
}

function pintarListaCotizaciones() {
  const cont = $("cotAnteriores");
  if (!cotLista.length) { cont.innerHTML = ""; cont.classList.add("oculto"); return; }
  cont.classList.remove("oculto");
  cont.innerHTML = '<span class="rotulo">Cotizaciones de esta orden</span>' +
    cotLista.map(c => `
      <div class="fila-cot-ant">
        <button type="button" class="cot-cargar${c.id === cotizacionId ? " actual" : ""}" data-id="${c.id}">COT-${String(c.id).padStart(4, "0")} · ${fechaCL(c.creado_en)}</button>
        <button type="button" class="cot-borrar" data-id="${c.id}" aria-label="Eliminar cotización">🗑</button>
      </div>`).join("");
  cont.querySelectorAll(".cot-cargar").forEach(b => {
    b.onclick = () => cargarCotizacion(+b.dataset.id);
  });
  cont.querySelectorAll(".cot-borrar").forEach(b => {
    b.onclick = () => borrarCotizacion(+b.dataset.id);
  });
}

async function borrarCotizacion(id) {
  if (!confirm("¿Eliminar esta cotización? No se puede deshacer.")) return;
  msg("cotError", "");
  const { error } = await db.from("cotizaciones").delete().eq("id", id);
  if (error) return msg("cotError", "No se pudo eliminar: " + error.message);
  cotLista = cotLista.filter(c => c.id !== id);
  if (cotizacionId === id) {
    await cargarCotizacion(cotLista[0]?.id ?? null);
    const neto = cotLista.length ? cotItemsData.reduce((s, i) => s + (i.cantidad || 0) * (i.valor_unitario || 0), 0) : null;
    await db.from("ordenes").update({ monto_cotizado: neto }).eq("id", ordenActual.id);
  } else {
    pintarListaCotizaciones();
  }
}

function pintarItemsCotizacion() {
  const cont = $("cotItems");
  cont.innerHTML = "";
  cotItemsData.forEach((item, i) => {
    const fila = document.createElement("div");
    fila.className = "item-cot";
    fila.innerHTML = `
      <div class="campo">
        <label>Descripción</label>
        <input class="desc" placeholder="Ej: Banqueo de módulo ADM">
      </div>
      <div class="fila-cv">
        <div class="campo">
          <label>Cantidad</label>
          <input class="cant" inputmode="decimal" placeholder="1">
        </div>
        <div class="campo">
          <label>Valor unitario</label>
          <input class="val" inputmode="numeric" placeholder="0">
        </div>
        <button type="button" class="quitar-item" aria-label="Quitar ítem">×</button>
      </div>`;
    const iDesc = fila.querySelector(".desc"), iCant = fila.querySelector(".cant"), iVal = fila.querySelector(".val");
    iDesc.value = item.descripcion;
    iCant.value = item.cantidad;
    iVal.value = item.valor_unitario || "";

    iDesc.oninput = e => { item.descripcion = e.target.value; };
    iCant.oninput = e => {
      item.cantidad = parseFloat(e.target.value.replace(",", ".")) || 0;
      actualizarTotalesCot();
    };
    iVal.oninput = e => {
      e.target.value = e.target.value.replace(/\D/g, "");
      item.valor_unitario = parseInt(e.target.value || "0", 10);
      actualizarTotalesCot();
    };
    fila.querySelector(".quitar-item").onclick = () => {
      cotItemsData.splice(i, 1);
      if (!cotItemsData.length) cotItemsData.push({ descripcion: "", cantidad: 1, valor_unitario: 0 });
      pintarItemsCotizacion();
    };
    cont.appendChild(fila);
  });
  actualizarTotalesCot();
}

function actualizarTotalesCot() {
  const neto = cotItemsData.reduce((s, i) => s + (i.cantidad || 0) * (i.valor_unitario || 0), 0);
  const iva = Math.round(neto * 0.19);
  $("cotNeto").textContent = "$" + miles(neto);
  $("cotIva").textContent = "$" + miles(iva);
  $("cotTotal").textContent = "$" + miles(neto + iva);
}

$("btnAgregarItem").onclick = () => {
  cotItemsData.push({ descripcion: "", cantidad: 1, valor_unitario: 0 });
  pintarItemsCotizacion();
};

async function guardarItemsCotizacion() {
  msg("cotError", "");
  const items = cotItemsData
    .map(i => ({ ...i, descripcion: i.descripcion.trim() }))
    .filter(i => i.descripcion && i.valor_unitario > 0);
  if (!items.length) { msg("cotError", "Agrega al menos un ítem con descripción y valor."); return false; }
  const validez = parseInt($("cotValidez").value, 10) || 15;

  try {
    const { data:{ user } } = await db.auth.getUser();
    let id = cotizacionId;
    if (!id) {
      const { data: nueva, error } = await db.from("cotizaciones")
        .insert({ orden_id: ordenActual.id, creado_por: user.id, validez_dias: validez })
        .select("id,creado_en").single();
      if (error) throw error;
      id = nueva.id;
      cotizacionId = id;
      cotLista.unshift({ id, validez_dias: validez, creado_en: nueva.creado_en });
    } else {
      const { error } = await db.from("cotizaciones").update({ validez_dias: validez }).eq("id", id);
      if (error) throw error;
    }

    const { error: eDel } = await db.from("cotizacion_items").delete().eq("cotizacion_id", id);
    if (eDel) throw eDel;
    const { error: eIns } = await db.from("cotizacion_items").insert(
      items.map((it, idx) => ({
        cotizacion_id: id,
        descripcion: it.descripcion,
        cantidad: it.cantidad,
        valor_unitario: it.valor_unitario,
        orden_item: idx
      }))
    );
    if (eIns) throw eIns;

    const flujo = flujoDe(ordenActual);
    const idxActual = flujo.indexOf(ordenActual.estado);
    const idxCotizado = flujo.indexOf("cotizado");
    if (idxActual >= 0 && idxCotizado >= 0 && idxActual < idxCotizado) {
      await db.from("ordenes").update({ estado: "cotizado" }).eq("id", ordenActual.id);
      ordenActual.estado = "cotizado";
    }
    return true;
  } catch (e) {
    msg("cotError", "No se pudo guardar la cotización: " + (e.message || "error desconocido"));
    return false;
  }
}

  const pruebas = $("cPruebas").value.trim();
  const solucion = $("cSolucion").value.trim();
  if (!pruebas)  return msg("cieError", "Escribe los trabajos realizados.");
  if (!solucion) return msg("cieError", "Escribe el resultado final.");

  $("btnGenerar").disabled = true;
  $("btnGenerar").textContent = "Guardando\u2026";
  try {
    const { data:{ user } } = await db.auth.getUser();

    if (ordenActual.vehiculo_id && $("cModelo").value.trim())
      await db.from("vehiculos").update({ modelo: $("cModelo").value.trim() })
        .eq("id", ordenActual.vehiculo_id);

    const { error: e1 } = await db.from("ordenes").update({
      monto_final: monto || null,
      observaciones: $("cObs").value.trim() || null
    }).eq("id", ordenActual.id);
    if (e1) throw e1;

    const campos = {
      orden_id: ordenActual.id,
      tipo_modulo: ordenActual.tipo_modulo,
      sintoma: ordenActual.sintoma_cliente || "Sin detalle",
      pruebas_realizadas: pruebas,
      causa_raiz: $("cCausa").value.trim() || null,
      solucion: solucion,
      resuelto: true,
      tecnico_id: user.id
    };
    const { data: ex } = await db.from("diagnosticos").select("id")
      .eq("orden_id", ordenActual.id).order("id").limit(1);
    const { error: e2 } = (ex && ex.length)
      ? await db.from("diagnosticos").update(campos).eq("id", ex[0].id)
      : await db.from("diagnosticos").insert(campos);
    if (e2) throw e2;

    await mostrarInforme();
  } catch (e) {
    msg("cieError", "No se pudo guardar: " + (e.message || "error desconocido"));
  } finally {
    $("btnGenerar").disabled = false;
    $("btnGenerar").textContent = "Guardar y ver informe";
  }
};

    .select("pruebas_realizadas,causa_raiz,solucion")
    .eq("orden_id", ordenActual.id).order("id").limit(1);
  const dg = (d && d[0]) || {};

  const neto = m?.[0]?.monto_final || 0;

  $("hojaInforme").innerHTML = `
  <div class="hoja">
    <div class="cab">

      <div class="sub">${o.tipo_trabajo === "servicio" ? "Servicio t\u00e9cnico en terreno" : "Reparaci\u00f3n de m\u00f3dulos electr\u00f3nicos"} Mercedes Benz &middot; Talca &middot; ${escapar(o.numero_ot)}</div>
    </div>

    <table class="datos">
      <tr><td class="et">Cliente</td><td>${escapar(o.clientes?.nombre)}</td></tr>
      <tr><td class="et">RUT</td><td>${escapar(o.clientes?.rut ?? "\u2014")}</td></tr>
      <tr><td class="et">Veh\u00edculo</td><td>${escapar(o.vehiculos?.modelo ?? "\u2014")}</td></tr>
      <tr><td class="et">Patente</td><td>${escapar(o.vehiculos?.patente ?? "\u2014")}</td></tr>
      <tr><td class="et">${o.tipo_trabajo === "servicio" ? "Sistema" : "M\u00f3dulo"}</td><td>${escapar(o.tipo_trabajo === "servicio" ? o.sistema : o.tipo_modulo)}</td></tr>
      <tr><td class="et">Fecha</td><td>${fechaCL(o.fecha_cierre || Date.now())}</td></tr>
    </table>

    <div class="resultado">${escapar(dg.solucion)}</div>

    <h3>1. Antecedentes</h3>
    <p>${escapar(o.sintoma_cliente)}</p>

    <h3>2. Trabajos realizados</h3>
    <p>${escapar(dg.pruebas_realizadas)}</p>

    <h3>3. Resultado final</h3>
    <p>${escapar(dg.causa_raiz ? dg.causa_raiz + "\n\n" + dg.solucion : dg.solucion)}</p>

    <h3>4. Valor del servicio</h3>
    <table class="valor">
      <tr><td>Neto</td><td>$${miles(neto)}</td></tr>
      <tr><td>IVA 19%</td><td>$${miles(iva)}</td></tr>
      <tr class="total"><td>Total</td><td>$${miles(neto + iva)}</td></tr>
    </table>

    <h3>5. Observaciones</h3>
    <p>${escapar(o.observaciones ?? "Sin observaciones.")}</p>

    <div class="firmas">
      <div>Jonatan Daniel Toledo Orellana<br>Paz Services LTDA.</div>
      <div>Recepci\u00f3n conforme<br>Cliente</div>
    </div>
  </div>`;
  ver("vInforme");
}

$("btnImprimir").onclick = () => window.print();
$("btnInfVolver").onclick = () => abrirDetalle(ordenActual);

// ---------- Utilidades ----------
async function subirFoto(orden_id, blob, categoria) {
  const ruta = `${orden_id}/${categoria}-${Date.now()}.jpg`;
  const { error } = await db.storage.from("archivos").upload(ruta, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  const { data:{ user } } = await db.auth.getUser();
  await db.from("archivos").insert({ orden_id, categoria, ruta_storage: ruta, subido_por: user.id });
}

function comprimir(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("no se pudo procesar la imagen")), "image/jpeg", 0.72);
    };
    img.onerror = () => reject(new Error("no se pudo leer la imagen"));
    img.src = URL.createObjectURL(file);
  });
}
